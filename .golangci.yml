version: "2"

run:
  timeout: 5m

linters:
  enable:
    - errcheck
    - goconst
    - gocyclo
    - gosec
    - govet
    - ineffassign
    - misspell
    - revive
    - staticcheck
    - unused

  settings:
    errcheck:
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    gocyclo:
      min-complexity: 30
    goconst:
      min-len: 3
      min-occurrences: 3
    revive:
      rules:
        - name: exported
          disabled: true

  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - gosec
          - goconst
          - gocyclo
      - path: examples/
        linters:
          - gosec
          - errcheck
          - gocyclo
          - goconst
      - path: (^|/)storetest/
        linters:
          - goconst
      # The adapters still build v1 stream deltas internally and upgrade
      # them to part deltas where Stream returns, until each emits parts
      # natively.
      - path: agent/provider/(anthropic|google|openai)/
        linters:
          - staticcheck
        text: "SA1019: types\\.\\w+ is deprecated: v1 stream form"
