name: CI

on:
  pull_request:
    branches: [main, "release/**"]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.4

  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go vet ./...

  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['stable', 'oldstable']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
      - run: go test -coverprofile=coverage.out -covermode=atomic ./...
      - uses: actions/upload-artifact@v7
        if: matrix.go-version == 'stable'
        with:
          name: coverage
          path: coverage.out

  race:
    name: Race Detector
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go test -race -count=1 ./...

  # Postgres-backed tests skip unless SAIGE_TEST_POSTGRES_DSN is set. This job
  # provides a pgvector database so they run on every pull request. Tests that
  # also need Ollama still skip here; run them with `just test-integration`.
  # Packages run one at a time (-p 1) because their tests truncate the same
  # tables.
  integration:
    name: Integration (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: paradedb/paradedb:0.26.1-pg18
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      SAIGE_TEST_POSTGRES_DSN: postgres://postgres:test@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: >-
          go test -count=1 -p 1 -v
          ./integration/...
          ./postgres/...
          ./agent/pgstore/...
          ./agent/durable/duraturo/...
          ./agent/definition/...
          ./eval/pgstore/...
          ./eval/online/...
          ./rag/pgstore/...
          ./rag/knowledge/pgstore/...
          ./cmd/saige/

  # Benchmarks run on every pull request so a benchmark that no longer
  # compiles or panics fails the build. Timings on shared runners are noisy,
  # so the job reports them as an artifact and does not compare them.
  bench:
    name: Benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      # An explicit bash shell turns on pipefail, so a failing benchmark is not
      # hidden by tee.
      - shell: bash
        run: >-
          go test -run='^$' -bench=. -benchmem -benchtime=200ms
          ./agent/
          ./agent/provider/cache/
          ./agent/provider/retry/
          ./agent/provider/router/
          ./agent/store/filewal/
          ./agent/tree/
          ./rag/bm25retriever/
          ./rag/chunker/
          ./rag/memstore/
          | tee benchmarks.txt
      - uses: actions/upload-artifact@v7
        with:
          name: benchmarks
          path: benchmarks.txt

  vuln:
    name: Vulnerability Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      # govulncheck tracks the newest Go release, so building it can need a
      # newer toolchain than go.mod pins. setup-go sets GOTOOLCHAIN=local, which
      # forbids fetching one; lift that for the install only. The scan below
      # still runs against the go.mod toolchain, so standard-library findings
      # describe the Go version this module actually ships on.
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
        env:
          GOTOOLCHAIN: auto
      - run: govulncheck ./...

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go build ./...

  # The README and the parts guide embed the programs under
  # examples/quickstart and examples/parts with fsrc markers. The build job
  # compiles those programs; this job fails when a document no longer
  # matches them. Fix with `fsrc run README.md docs/parts.md`.
  embed:
    name: Embedded examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: urmzd/fsrc@v4
        with:
          files: README.md docs/parts.md
          commit-dry: "true"
          commit-push: "false"
      # The action stages the files, so compare against HEAD, not the index.
      - run: git diff --exit-code HEAD -- README.md docs/parts.md
