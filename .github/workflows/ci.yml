name: CI

on:
  pull_request:
    branches: [main, "release/**"]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.4

  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...

  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['stable', 'oldstable']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
      - run: go test -coverprofile=coverage.out -covermode=atomic ./...
      - uses: actions/upload-artifact@v7
        if: matrix.go-version == 'stable'
        with:
          name: coverage
          path: coverage.out

  race:
    name: Race Detector
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test -race -count=1 ./...

  # Postgres-backed tests skip unless SAIGE_TEST_POSTGRES_DSN is set. This job
  # provides a pgvector database so they run on every pull request. Tests that
  # also need Ollama still skip here; run them with `just test-integration`.
  # Packages run one at a time (-p 1) because their tests truncate the same
  # tables.
  integration:
    name: Integration (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: paradedb/paradedb:0.26.1-pg18
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      SAIGE_TEST_POSTGRES_DSN: postgres://postgres:test@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: >-
          go test -count=1 -p 1 -v
          ./integration/...
          ./postgres/...
          ./agent/pgstore/...
          ./agent/durable/anchor/...
          ./agent/definition/...
          ./eval/pgstore/...
          ./eval/online/...
          ./rag/pgstore/...
          ./rag/knowledge/pgstore/...
          ./cmd/saige/
      # The durable engine's Postgres adapters, behind the integration tag.
      - run: go test -tags=integration -count=1 -p 1 -v ./durable/adapters/postgres/...
      # flow's Postgres stores and the durable stop tests, each in a schema of its own.
      - run: go test -count=1 -p 1 ./flow/...

  # The sandbox's isolation boundary: the isolate conformance suite and the
  # egress test against Docker under gVisor, required to run, not skipped.
  gvisor:
    name: Sandbox under gVisor
    runs-on: ubuntu-latest
    env:
      # A pinned gVisor release, checked against this digest before use.
      GVISOR_RELEASE: "20261012"
      GVISOR_SHA512: 9606445eed5aedfcf05310e7ccef61d994089914c6622fc82624c24d2b18db1b2210f40e40a7be27b8b7772859de7d95c501b4eba66423053c960bf671377c5e
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install runsc as a Docker runtime
        run: |
          curl -fsSLo "$RUNNER_TEMP/gvisor.tar.bz2" "https://storage.googleapis.com/gvisor/releases/release/${GVISOR_RELEASE}/x86_64/gvisor.tar.bz2"
          echo "${GVISOR_SHA512}  $RUNNER_TEMP/gvisor.tar.bz2" | sha512sum --check --strict
          tar -xjf "$RUNNER_TEMP/gvisor.tar.bz2" -C "$RUNNER_TEMP" runsc
          sudo install -m 0755 "$RUNNER_TEMP/runsc" /usr/local/bin/runsc
          # --oci-seccomp: gVisor enforces the driver's seccomp profile too.
          # --host-uds=all: compartments' unix sockets cross sandboxes through
          # the shared socket directory.
          sudo runsc install -- --oci-seccomp --host-uds=all
          sudo systemctl restart docker
          runsc --version
      - name: Conformance suite under runsc
        env:
          SANDBOX_DOCKER_TEST_RUNTIME: runsc
          SANDBOX_DOCKER_TEST_REQUIRED: "1"
        run: go test -race -count=1 -v ./sandbox/isolate/docker/

  # Benchmarks run on every pull request so a benchmark that no longer
  # compiles or panics fails the build. Timings on shared runners are noisy,
  # so the job reports them as an artifact and does not compare them.
  bench:
    name: Benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # An explicit bash shell turns on pipefail, so a failing benchmark is not
      # hidden by tee.
      - shell: bash
        run: >-
          go test -run='^$' -bench=. -benchmem -benchtime=200ms
          ./agent/
          ./agent/provider/cache/
          ./agent/provider/retry/
          ./agent/provider/router/
          ./agent/store/filewal/
          ./agent/tree/
          ./rag/bm25retriever/
          ./rag/chunker/
          ./rag/memstore/
          | tee benchmarks.txt
      - uses: actions/upload-artifact@v7
        with:
          name: benchmarks
          path: benchmarks.txt

  vuln:
    name: Vulnerability Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # govulncheck tracks the newest Go release, so building it can need a
      # newer toolchain than go.mod pins. setup-go sets GOTOOLCHAIN=local, which
      # forbids fetching one; lift that for the install only. The scan below
      # still runs against the go.mod toolchain, so standard-library findings
      # describe the Go version this module actually ships on.
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
        env:
          GOTOOLCHAIN: auto
      - run: govulncheck ./...

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go build ./...

  # The README, the parts guide and the sandbox README embed the programs
  # under examples/quickstart, examples/parts and examples/sandbox with fsrc
  # markers. The build job compiles those programs; this job fails when a
  # document no longer matches them. Fix with
  # `fsrc run README.md docs/guides/parts.md sandbox/README.md`.
  embed:
    name: Embedded examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: urmzd/fsrc@v4
        with:
          files: README.md docs/guides/parts.md sandbox/README.md
          commit-dry: "true"
          commit-push: "false"
      # The action stages the files, so compare against HEAD, not the index.
      - run: git diff --exit-code HEAD -- README.md docs/guides/parts.md sandbox/README.md
