name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  ci:
    if: github.actor != 'sr-releaser[bot]'
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: Iv23liUsXGDICnIdo3Ev
          private-key: ${{ secrets.SR_RELEASER_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # Plan first so the binaries can embed the version that release will cut.
      - name: Plan release
        id: plan
        uses: urmzd/sr@v8
        with:
          mode: plan
          github-token: ${{ steps.app-token.outputs.token }}

      # Cross-compile every target on one runner (CGO disabled), so the binaries
      # exist before the release is created and can be attached atomically. This
      # avoids uploading to an already-published release, which immutable
      # releases reject.
      - name: Build static CLI binaries
        shell: bash
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          mkdir -p build/bin
          build() {
            CGO_ENABLED=0 GOOS="$1" GOARCH="$2" go build -trimpath \
              -ldflags "-s -w -X main.version=${VERSION}" \
              -o "build/bin/$3" ./cmd/saige
          }
          build linux   amd64 saige-linux
          build darwin  arm64 saige-darwin
          build windows amd64 saige.exe

      # release mode tags, creates the release, and uploads the artifacts as one
      # step, so assets are present when the release is published.
      - name: Release
        uses: urmzd/sr@v8
        with:
          mode: release
          github-token: ${{ steps.app-token.outputs.token }}
          artifacts: build/bin/saige-linux build/bin/saige-darwin build/bin/saige.exe
