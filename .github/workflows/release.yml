name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  ci:
    if: github.actor != 'sr-releaser[bot]'
    uses: ./.github/workflows/ci.yml

  release:
    environment: release
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: Iv23liUsXGDICnIdo3Ev
          private-key: ${{ secrets.SR_RELEASER_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # Plan first so the binaries can embed the version that release will cut.
      - name: Plan release
        id: plan
        uses: urmzd/sr@v9
        with:
          mode: plan
          github-token: ${{ steps.app-token.outputs.token }}

      # Cross-compile every target on one runner (CGO disabled), so the binaries
      # exist before the release is created and can be attached atomically. This
      # avoids uploading to an already-published release, which immutable
      # releases reject.
      - name: Build static binaries
        shell: bash
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p build/bin
          # Asset names follow <bin>-<goos>-<goarch>[.exe]. saige update and
          # install.sh both derive the same names, so keep the three in sync.
          targets="linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64"
          for bin in saige saige-mcp; do
            for target in $targets; do
              goos="${target%/*}"
              goarch="${target#*/}"
              ext=""
              if [ "$goos" = "windows" ]; then ext=".exe"; fi
              CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" go build -trimpath \
                -ldflags "-s -w -X main.version=${VERSION}" \
                -o "build/bin/${bin}-${goos}-${goarch}${ext}" "./cmd/${bin}"
            done
          done
          (cd build/bin && sha256sum saige-* > SHA256SUMS)
          cat build/bin/SHA256SUMS

      # release mode tags, creates the release, and uploads the artifacts as one
      # step, so assets are present when the release is published.
      - name: Release
        uses: urmzd/sr@v9
        with:
          mode: release
          github-token: ${{ steps.app-token.outputs.token }}
          artifacts: >-
            build/bin/saige-linux-amd64
            build/bin/saige-linux-arm64
            build/bin/saige-darwin-amd64
            build/bin/saige-darwin-arm64
            build/bin/saige-windows-amd64.exe
            build/bin/saige-mcp-linux-amd64
            build/bin/saige-mcp-linux-arm64
            build/bin/saige-mcp-darwin-amd64
            build/bin/saige-mcp-darwin-arm64
            build/bin/saige-mcp-windows-amd64.exe
            build/bin/SHA256SUMS
